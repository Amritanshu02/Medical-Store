services:
  # Frontend React Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"  # Map container port 80 to host port 3000
    depends_on:
      - backend
    environment:
      - REACT_APP_BACKEND_URL=http://backend:8080
    restart: unless-stopped

  # Backend Spring Boot Application
  backend:
    build:
      context: ./Medical-Store-Backend
      dockerfile: Dockerfile
    ports:
      - "9000:8080"  # Map container port 8080 to host port 8080
    depends_on:
      - database
    environment:
      - SERVER_PORT=8080
      # MongoDB connection string
      # - SPRING_DATA_MONGODB_URI=mongodb://database:27017/medical_store
      # - SPRING_DATA_MONGODB_DATABASE=medical_store
      - SPRING_MONGODB_URI=mongodb://database:27017/medical_store
      - SPRING_MONGODB_DATABASE=medical_store
      # Email configuration (update with actual credentials or use secrets)
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=amritanshu9794203555@gmail.com
      - SPRING_MAIL_PASSWORD=your-app-password
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=true
      - APP_SUPPORT_EMAIL=amritanshu9794203555@gmail.com
    restart: unless-stopped

  # MongoDB Database
  database:
    image: mongo:6.0
    ports:
      - "27017:27017"  # Map container port 27017 to host port 27017
    volumes:
      - mongo_data:/data/db  # Persist data
    environment:
      - MONGO_INITDB_DATABASE=medical_store
    restart: unless-stopped

volumes:
  mongo_data: